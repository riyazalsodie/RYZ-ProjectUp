[package]
name = "ryz-projectup"
version = "0.2.0-beta.1"
description = "Git-aware project backups to Google Drive — a modern Tauri desktop vault."
authors = ["R ! Y 4 Z"]
license = "MIT"
repository = "https://github.com/riyazalsodie/RYZ-ProjectUp"
homepage = "https://github.com/riyazalsodie/RYZ-ProjectUp"
keywords = ["tauri", "backup", "google-drive", "gitignore", "desktop"]
categories = ["filesystem", "gui", "utility"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "ryz_projectup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ignore = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
dunce = "1.0"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
open = "5.3"
