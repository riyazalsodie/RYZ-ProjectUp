name: Bug report
description: Report a reproducible bug in the RYZ ProjectUp beta.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the beta. Please do **not** include OAuth secrets, tokens or personal file paths.
        For security vulnerabilities, use the private process in SECURITY.md instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: ProjectUp crashed / ignored a file / showed an error when...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add project...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ProjectUp version
      placeholder: "0.4.2-beta.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: project-type
    attributes:
      label: Project type / ecosystem
      placeholder: Flutter, Node.js, Rust, monorepo, ...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact tokens, emails, client secrets and personal paths.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed OAuth secrets, tokens and personal paths from everything I posted.
          required: true
